<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>パパごはん | kichi.page</title>

<style>
  :root {
    --bg: #f4efe4;          /* 生成り */
    --card: #fbf8f1;
    --ink: #2b2a28;
    --sub: #857b6a;
    --line: #ddd3c1;
    --ai: #2f3d5e;          /* 藍 */
    --ai-dark: #24304c;
    --stitch: #e9e3d4;
    --shu: #b5442f;         /* 朱 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b20;
      --card: #22242b;
      --ink: #ebe5d8;
      --sub: #a1988a;
      --line: #383a43;
      --ai: #4a5c86;
      --ai-dark: #3a4a70;
      --stitch: #d8d2c4;
      --shu: #c9583f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    line-height: 1.9;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 16px 40px; }

  /* 見出し */
  header { text-align: center; }
  .apron { width: min(320px, 86vw); height: auto; display: block; margin: 0 auto 20px; }
  .title { display: inline-flex; align-items: center; gap: 12px; }
  h1 { font-size: 30px; font-weight: 500; letter-spacing: 0.22em; }
  .seal {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px;
    border: 1.5px solid var(--shu); border-radius: 3px;
    color: var(--shu); font-size: 14px; line-height: 1;
    transform: rotate(-4deg);
  }
  .lead { margin-top: 14px; color: var(--sub); font-size: 15px; }

  /* 献立帳 */
  section { margin-top: 56px; }
  h2 {
    display: flex; align-items: center; gap: 14px;
    font-size: 15px; font-weight: 500; letter-spacing: 0.3em; color: var(--sub);
  }
  h2::before, h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .list { list-style: none; margin-top: 20px; display: grid; gap: 12px; }
  .list a, .list .soon {
    display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; align-items: baseline;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ai);
    border-radius: 4px;
    color: inherit; text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .list a:hover { transform: translateY(-2px); border-color: var(--ai); }
  .date { grid-row: span 2; color: var(--sub); font-size: 13px; letter-spacing: 0.05em; }
  .date small { display: block; font-size: 11px; line-height: 1.4; opacity: .8; }
  .dish { font-size: 16px; line-height: 1.55; }
  .note { color: var(--sub); font-size: 13px; line-height: 1.6; }
  .list .soon { border-left-color: var(--line); color: var(--sub); }

</style>
</head>
<body>
